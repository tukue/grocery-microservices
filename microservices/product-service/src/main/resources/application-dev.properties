spring.datasource.url=jdbc:h2:mem:product-dev-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.h2.console.enabled=true
server.port=8083
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Dev consumers trust the cart-service demo identity provider. Only cart-service
# mints tokens, so one customer token works across the local API surface.
security.jwt.demo-enabled=false
security.jwt.issuer-uri=${DEMO_IDENTITY_BASE_URL:http://localhost:8080}
security.jwt.audience=${JWT_AUDIENCE:grocery-api}

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Structured Logging
logging.pattern.console={"time": "%d{yyyy-MM-dd HH:mm:ss.SSS}", "level": "%level", "thread": "%thread", "logger": "%logger", "message": "%message"}%n
