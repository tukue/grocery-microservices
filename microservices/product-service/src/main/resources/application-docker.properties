spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://product-db:5432/grocery}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:grocellery}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Embedded demo identity provider keeps the compose smoke stack self-contained
# when no external IdP is supplied; override with a real issuer in production.
# For cross-service demo flows set JWT_ISSUER_URI=http://cart-service:8080 on all services.
security.jwt.demo-enabled=true
security.jwt.issuer-uri=${JWT_ISSUER_URI:http://product-service:8080}
security.jwt.audience=${JWT_AUDIENCE:grocery-api}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
logging.pattern.console={"time":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","logger":"%logger","message":"%message"}%n
