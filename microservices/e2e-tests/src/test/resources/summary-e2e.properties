# Base configuration for the summary-service context in e2e tests.
# Activated via --spring.config.name=summary-e2e on the SpringApplicationBuilder so it
# never collides with the order-service's application-docker.properties on the
# shared classpath. Dynamic values (datasource, kafka, ports, issuer) are supplied
# as command-line args which take precedence over this file.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/summary

app.cors.allowed-origins=http://localhost:3000

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.grocery.microservices.summary.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.grocery.microservices.summary.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.admin.fail-fast=true

app.kafka.topics.order-created=order.created.v1
app.kafka.consumer-group=summary-service
app.kafka.consumer.retry-delay-ms=1000
app.kafka.consumer.maximum-retries=3
app.kafka.consumer.concurrency=1

security.jwt.demo-enabled=true
security.jwt.demo-username=demo-user
security.jwt.demo-password=
security.jwt.audience=grocery-api

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized