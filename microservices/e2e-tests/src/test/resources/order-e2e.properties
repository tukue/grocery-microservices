# Base configuration for the order-service context in e2e tests.
# Activated via --spring.config.name=order-e2e on the SpringApplicationBuilder so it
# never collides with the summary-service's application-docker.properties on the
# shared classpath. Dynamic values (datasource, kafka, ports, issuer) are supplied
# as command-line args which take precedence over this file.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/order

app.cors.allowed-origins=http://localhost:3000

services.cart.base-url=http://cart-service:8080
services.cart.connect-timeout-ms=2000
services.cart.read-timeout-ms=3000
services.product.base-url=http://product-service:8080
services.product.connect-timeout-ms=2000
services.product.read-timeout-ms=3000

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=3
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.admin.fail-fast=true

app.kafka.topics.order-created=order.created.v1
app.kafka.event-store.fixed-delay-ms=1000
app.kafka.event-store.batch-size=100
app.kafka.event-store.maximum-retries=10
app.kafka.event-store.lease-duration=PT30S
app.kafka.event-store.retry-delay=PT5S
app.kafka.event-store.publish-timeout=PT30S

security.jwt.demo-enabled=true
security.jwt.demo-username=demo-user
security.jwt.demo-password=
security.jwt.audience=grocery-api

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized