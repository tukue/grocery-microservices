spring.datasource.url=jdbc:h2:mem:order-dev-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
server.port=8081
services.cart.base-url=${CART_SERVICE_BASE_URL:http://localhost:8082}
services.cart.connect-timeout-ms=${CART_SERVICE_CONNECT_TIMEOUT_MS:2000}
services.cart.read-timeout-ms=${CART_SERVICE_READ_TIMEOUT_MS:3000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=${KAFKA_PRODUCER_RETRIES:3}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:30000}
app.kafka.topics.order-created=${KAFKA_ORDER_CREATED_TOPIC:order.created.v1}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topics.order-created=${KAFKA_ORDER_CREATED_TOPIC:order.created.v1}
app.kafka.event-store.fixed-delay-ms=${KAFKA_EVENT_STORE_FIXED_DELAY_MS:1000}
app.kafka.event-store.batch-size=${KAFKA_EVENT_STORE_BATCH_SIZE:100}
app.kafka.event-store.maximum-retries=${KAFKA_EVENT_STORE_MAXIMUM_RETRIES:10}
app.kafka.event-store.lease-duration=${KAFKA_EVENT_STORE_LEASE_DURATION:PT30S}
app.kafka.event-store.retry-delay=${KAFKA_EVENT_STORE_RETRY_DELAY:PT5S}

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Structured Logging
logging.pattern.console={"time": "%d{yyyy-MM-dd HH:mm:ss.SSS}", "level": "%level", "thread": "%thread", "logger": "%logger", "message": "%message"}%n 
