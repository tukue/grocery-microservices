spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=true
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
services.cart.base-url=${CART_SERVICE_BASE_URL}
services.cart.connect-timeout-ms=${CART_SERVICE_CONNECT_TIMEOUT_MS:2000}
services.cart.read-timeout-ms=${CART_SERVICE_READ_TIMEOUT_MS:3000}
services.product.base-url=${PRODUCT_SERVICE_BASE_URL}
services.product.connect-timeout-ms=${PRODUCT_SERVICE_CONNECT_TIMEOUT_MS:2000}
services.product.read-timeout-ms=${PRODUCT_SERVICE_READ_TIMEOUT_MS:3000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=${KAFKA_PRODUCER_RETRIES:3}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:30000}
app.kafka.topics.order-created=${KAFKA_ORDER_CREATED_TOPIC:order.created.v1}

# Production requires a real identity provider. Missing JWT_ISSUER_URI/JWT_AUDIENCE
# fails startup (unresolved placeholders), and demo auth is never enabled here.
security.jwt.demo-enabled=false
security.jwt.issuer-uri=${JWT_ISSUER_URI}
security.jwt.audience=${JWT_AUDIENCE}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.admin.fail-fast=true
app.kafka.topics.order-created=${KAFKA_ORDER_CREATED_TOPIC:order.created.v1}
app.kafka.event-store.fixed-delay-ms=${KAFKA_EVENT_STORE_FIXED_DELAY_MS:1000}
app.kafka.event-store.batch-size=${KAFKA_EVENT_STORE_BATCH_SIZE:100}
app.kafka.event-store.maximum-retries=${KAFKA_EVENT_STORE_MAXIMUM_RETRIES:10}
app.kafka.event-store.lease-duration=${KAFKA_EVENT_STORE_LEASE_DURATION:PT30S}
app.kafka.event-store.retry-delay=${KAFKA_EVENT_STORE_RETRY_DELAY:PT5S}
app.kafka.event-store.publish-timeout=${KAFKA_EVENT_STORE_PUBLISH_TIMEOUT:PT30S}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
logging.pattern.console={"time":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","logger":"%logger","message":"%message"}%n
