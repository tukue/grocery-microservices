spring.datasource.url=jdbc:h2:mem:summary-test-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
# server.address=localhost
jwt.secret=${random.uuid}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.grocery.microservices.summary.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.grocery.microservices.summary.event
spring.kafka.listener.auto-startup=false
app.kafka.topics.order-created=${KAFKA_ORDER_CREATED_TOPIC:order.created.v1}
app.kafka.consumer-group=${KAFKA_SUMMARY_CONSUMER_GROUP:summary-service}
app.kafka.topics.order-created-retry=${KAFKA_ORDER_CREATED_RETRY_TOPIC:order.created.retry.v1}
app.kafka.topics.order-created-failed=${KAFKA_ORDER_CREATED_FAILED_TOPIC:order.created.failed.v1}
app.kafka.retry.local-attempts=1
app.kafka.retry.max-attempts=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
