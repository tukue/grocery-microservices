x-postgres-common: &postgres-common
  image: postgres:13
  restart: unless-stopped
  environment:
    POSTGRES_USER: ${POSTGRES_USER:-grocellery}
    POSTGRES_DB: ${POSTGRES_DB:-grocery}
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-grocellery} -d ${POSTGRES_DB:-grocery}"]
    start_period: 30s
    interval: 5s
    timeout: 5s
    retries: 20

services:
  cart-db:
    <<: *postgres-common
    container_name: cart-db
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    networks:
      - backend

  order-db:
    <<: *postgres-common
    container_name: order-db
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - backend

  product-db:
    <<: *postgres-common
    container_name: product-db
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - backend

  summary-db:
    <<: *postgres-common
    container_name: summary-db
    volumes:
      - summary-db-data:/var/lib/postgresql/data
    networks:
      - backend

  kafka:
    image: apache/kafka:4.3.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  cart-service:
    build:
      context: ..
      dockerfile: microservices/cart-service/Dockerfile
    container_name: cart-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
    ports:
      - "8081:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      cart-db:
        condition: service_healthy
    networks:
      - backend

  order-service:
    build:
      context: ..
      dockerfile: microservices/order-service/Dockerfile
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
    ports:
      - "8082:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend

  product-service:
    build:
      context: ..
      dockerfile: microservices/product-service/Dockerfile
    container_name: product-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
    ports:
      - "8083:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - backend

  summary-service:
    build:
      context: ..
      dockerfile: microservices/summary-service/Dockerfile
    container_name: summary-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
    ports:
      - "8084:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      summary-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - cart-db
      - order-db
      - product-db
      - summary-db
    networks:
      - backend
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - observability

volumes:
  cart-db-data:
  order-db-data:
  product-db-data:
  summary-db-data:

networks:
  backend:
    driver: bridge
  observability: {}
