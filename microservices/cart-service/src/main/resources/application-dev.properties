spring.datasource.url=jdbc:h2:mem:cart-dev-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Demo identity provider: embedded dev-only issuer that mints RS256 tokens and
# serves OIDC discovery + JWKS from this service's own base URL.
security.jwt.demo-enabled=true
security.jwt.issuer-uri=${DEMO_IDENTITY_BASE_URL:http://localhost:${server.port}}
security.jwt.audience=${JWT_AUDIENCE:grocery-api}

services.product.base-url=${PRODUCT_SERVICE_BASE_URL:http://product-service:8080}

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Structured Logging
logging.pattern.console={"time": "%d{yyyy-MM-dd HH:mm:ss.SSS}", "level": "%level", "thread": "%thread", "logger": "%logger", "message": "%message"}%n
