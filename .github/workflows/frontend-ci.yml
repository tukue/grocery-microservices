name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CART_SERVICE_URL: http://127.0.0.1:8080
      ORDER_SERVICE_URL: http://127.0.0.1:8081
      PRODUCT_SERVICE_URL: http://127.0.0.1:8083
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          CART_SERVICE_URL: http://cart-service.invalid
          ORDER_SERVICE_URL: http://order-service.invalid
          PRODUCT_SERVICE_URL: http://product-service.invalid

      # The smoke test mocks every API route, so the Java services are not
      # started here; Playwright's webServer boots the BFF + Vite dev server.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: npm run test:e2e
