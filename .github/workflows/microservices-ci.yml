name: Microservices CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'microservices/**'
      - 'pom.xml'
      - '.github/workflows/microservices-ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'microservices/**'
      - 'pom.xml'
      - '.github/workflows/microservices-ci.yml'
      - '!**/*.md'

# dorny/test-reporter creates a check run from the PR head SHA.
permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [cart-service, order-service, product-service, ledger-service]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    # Per-service test profiles are gitignored, so the checkout has no
    # application-test.properties on the test classpath. Recreate it from the
    # committed example before running the suite.
    - name: Prepare test properties
      run: |
        cp "microservices/${{ matrix.service }}/src/test/resources/application-test.properties.example" \
           "microservices/${{ matrix.service }}/src/test/resources/application-test.properties"

    - name: Test microservice
      run: mvn -B test -Dspring.profiles.active=test --file microservices/${{ matrix.service }}/pom.xml
      working-directory: ${{ github.workspace }}

    - name: Generate test report
      uses: dorny/test-reporter@v2
      if: ${{ !cancelled() }}
      with:
        name: ${{ matrix.service }} Tests
        path: microservices/${{ matrix.service }}/target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-empty: true

  health-check:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Start smoke test stack
      working-directory: microservices
      run: |
        export CORS_ALLOWED_ORIGINS="https://frontend.smoke.test"
        docker compose up -d cart-db order-db product-db ledger-db cart-service order-service product-service ledger-service

    - name: Verify health endpoints
      env:
        SKIP_START: "true"
        # Order and ledger services initialize both PostgreSQL and Kafka on a
        # cold Docker runner. Keep the smoke test bounded while allowing their
        # documented readiness path to complete.
        HEALTHCHECK_RETRIES: "60"
      working-directory: microservices
      run: |
        docker compose ps
        HEALTHCHECK_HOST=127.0.0.1 SKIP_START=true bash ../check_microservices_health.sh || {
          docker compose ps
          docker compose logs --no-color cart-service order-service product-service ledger-service
          exit 1
        }

    - name: Capture service logs
      if: always()
      working-directory: microservices
      run: docker compose logs --no-color > ../microservice-smoke.log

    - name: Tear down smoke test stack
      if: always()
      working-directory: microservices
      run: docker compose down --volumes

    - name: Upload service logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: microservice-logs
        path: microservice-smoke.log

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Prepare test properties
      run: |
        for service in cart-service order-service product-service ledger-service; do
          cp "microservices/$service/src/test/resources/application-test.properties.example" \
             "microservices/$service/src/test/resources/application-test.properties"
        done

    - name: Run order-to-ledger e2e tests
      # Keep e2e-tests and its service dependencies in the same Maven reactor.
      # `install` repackages Spring Boot services as executable jars, whose
      # application classes under BOOT-INF/classes are not compiler-visible to
      # the standalone e2e module. `verify` also runs Failsafe for *IT tests.
      run: mvn -B verify -Dmaven.test.skip=false -pl microservices/e2e-tests -am
      working-directory: ${{ github.workspace }}
