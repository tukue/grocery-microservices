name: Celebrate completed feature

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  celebrate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Celebrate the merged feature
        run: echo "## 🎉 Feature merged!" >> "$GITHUB_STEP_SUMMARY"
