version: 0.2

phases:
  install:
    runtime-versions:
      terraform: 1.5
      python: 3.9
    commands:
      - echo "Installing tfsec..."
      - curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      - echo "Installing tflint..."
      - curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - echo "Installing checkov..."
      - pip install checkov
  pre_build:
    commands:
      - cd terraform
      - terraform fmt -check -recursive || echo "Terraform formatting drift detected; run terraform fmt -recursive."
      - terraform validate
      - echo "Running TFLint..."
      - tflint --init
      - tflint --format compact
      - |
        IAC_SCAN_FAILED=0
        echo "Running tfsec..."
        tfsec . --format junit > tfsec-report.xml || IAC_SCAN_FAILED=1
        echo "Running checkov..."
        checkov -d . --quiet --output junitxml > checkov-report.xml || IAC_SCAN_FAILED=1
        if [ "$IAC_SCAN_FAILED" -ne 0 ]; then
          echo "Infrastructure security checks failed. Review tfsec-report.xml and checkov-report.xml."
          exit 1
        fi
      - |
        WORKSPACE=${TF_WORKSPACE:-dev}
        export WORKSPACE
        SHORT_SHA=$(printf '%s' "${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}" | cut -c1-12)
        export TF_VAR_image_tag="${IMAGE_TAG:-sha-${SHORT_SHA}}"
        if [ -n "${TF_STATE_BUCKET}" ]; then
          STATE_KEY_PREFIX=${TF_STATE_KEY_PREFIX:-${PROJECT_NAME:-grocellery-app}}
          LOCK_TABLE="${TF_STATE_LOCK_TABLE:-}"
          INIT_ARGS=(
            "-backend-config=bucket=${TF_STATE_BUCKET}"
            "-backend-config=key=${STATE_KEY_PREFIX}/${WORKSPACE}/terraform.tfstate"
            "-backend-config=region=${AWS_REGION}"
          )
          if [ -n "$LOCK_TABLE" ]; then
            INIT_ARGS+=("-backend-config=dynamodb_table=${LOCK_TABLE}")
          fi
          terraform init "${INIT_ARGS[@]}"
        else
          terraform init
        fi
        terraform workspace select "${WORKSPACE}" || terraform workspace new "${WORKSPACE}"
  build:
    commands:
      - |
        WORKSPACE=${WORKSPACE:-${TF_WORKSPACE:-dev}}
        set +e
        terraform plan -input=false -detailed-exitcode -out=tfplan
        PLAN_EXIT=$?
        set -e
        if [ ${PLAN_EXIT} -eq 1 ]; then
          echo "Terraform plan failed"
          exit 1
        fi
        if [ ${PLAN_EXIT} -eq 0 ]; then
          echo "No drift detected for workspace ${WORKSPACE}."
        fi
        if [ ${PLAN_EXIT} -eq 2 ]; then
          echo "Changes or drift detected for workspace ${WORKSPACE} (exit code 2)."
        fi
  post_build:
    commands:
      - echo "Terraform Plan complete for image tag ${TF_VAR_image_tag}. Waiting for approval to apply."

artifacts:
  files:
    - terraform/tfplan

reports:
  terraform-scans:
    files:
      - "terraform/tfsec-report.xml"
      - "terraform/checkov-report.xml"
    file-format: JUNITXML
